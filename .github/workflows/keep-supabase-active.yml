name: Keep Supabase active

on:
  schedule:
    # Every 5 days at 08:00 UTC — safely inside Supabase's 7-day pause window
    - cron: '0 8 */5 * *'
  workflow_dispatch: # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "URL secret length:      ${#SUPABASE_URL}"
          echo "Anon key secret length: ${#SUPABASE_ANON_KEY}"
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "A secret is EMPTY. Check both are Repository secrets (not Environment secrets) and names match exactly."
            exit 1
          fi
          STATUS=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/jobs?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase responded with HTTP $STATUS"
          echo "Response body: $(head -c 400 /tmp/resp.txt)"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Non-2xx response — see body above."
            exit 1
          fi
          echo "Supabase is awake."
